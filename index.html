function connectLocks(){
  var code=getSessionCode();
  if(!code||!window.mqtt)return;
  locksTopic='spectre_locks_v1_'+code;
  try{
    locksMc=mqtt.connect(LOCK_BROKER,{clientId:'lk'+Date.now(),clean:true,connectTimeout:8000,reconnectPeriod:5000});
    locksMc.on('connect',function(){locksMc.subscribe(locksTopic);});
    locksMc.on('message',function(t,p){
      try{var d=JSON.parse(p.toString());if(d.type==='locks'){currentLocks=d.locks;render();refreshLockModal();}}catch(e){}
    });
  }catch(e){}
}
function toggleLock(key){
  currentLocks[key]=!currentLocks[key];
  if(locksMc&&locksMc.connected){
    locksMc.publish(locksTopic,JSON.stringify({type:'locks',locks:currentLocks}),{retain:true});
  }
  render();
  refreshLockModal();
}

function toFakeEmail(username){return username.trim().toLowerCase().replace(/[^a-z0-9_-]/g,'')+EMAIL_DOMAIN;}

function getRole(){return currentUserData?currentUserData.role:null;}

function getSessionCode(){return currentUserData?currentUserData.sessionCode:null;}

function render(){
  var wrap=document.getElementById('wrap');
  if(!currentUser){wrap.innerHTML=renderAuth();return;}
  if(!currentUserData){wrap.innerHTML='<div class="loading">CHARGEMENT...</div>';return;}
  if(!currentUserData.approved){wrap.innerHTML=renderPending();return;}
  if(isMJ()){
    if(!getSessionCode()){wrap.innerHTML=renderSessionPrompt();return;}
    if(!locksMc)connectLocks();
    wrap.innerHTML=renderMJ();return;
  }
  var role=getRole();
  if(!role){wrap.innerHTML=renderPicker();return;}
  if(!getSessionCode()){wrap.innerHTML=renderSessionPrompt();return;}
  if(!locksMc)connectLocks();
  wrap.innerHTML=renderPersonal(role);
}

/* ═════ AUTH SCREEN ═════ */
function renderAuth(){
  var html='<div class="hero"><div class="hero-eyebrow">// OPÉRATION CABARET FANTÔME //</div><div class="hero-title">NEO-PARIS 2077</div><div class="hero-sub">Connecte-toi pour accéder à ton espace</div></div>';
  html+='<div class="authbox">';
  html+='<div class="authbox-tabs"><button class="authbox-tab '+(authMode==='login'?'on':'')+'" onclick="setAuthMode(\'login\')">SE CONNECTER</button><button class="authbox-tab '+(authMode==='signup'?'on':'')+'" onclick="setAuthMode(\'signup\')">CRÉER UN COMPTE</button></div>';
  html+='<div class="authbox-lbl">IDENTIFIANT</div><input type="text" id="auth-username" placeholder="Ex: kiki_le_nomade" autocomplete="off">';
  html+='<div class="authbox-lbl">MOT DE PASSE</div><input type="password" id="auth-password" placeholder="••••••••" onkeydown="if(event.key===\'Enter\')submitAuth();">';
  if(authMode==='signup'){
    html+='<div class="authbox-lbl">TON PERSONNAGE</div><div class="authbox-charpick">';
    Object.keys(CHARACTERS).forEach(function(k){
      var c=CHARACTERS[k];
      html+='<div class="authbox-charbtn'+(selectedSignupRole===k?' on':'')+'" data-k="'+k+'" style="--c:'+c.color+';" onclick="selSignupChar(\''+k+'\')"><span class="ico">'+c.ico+'</span><span class="nm">'+c.name+'</span></div>';
    });
    html+='</div>';
  }
  html+='<button class="authbox-btn" id="auth-submit-btn" onclick="submitAuth()">'+(authMode==='login'?'ENTRER':'CRÉER LE COMPTE')+'</button>';
  html+='<div class="authbox-err" id="auth-err"></div><div class="authbox-msg" id="auth-msg"></div>';
  html+='</div>';
  html+='<div class="foot">NEO-PARIS / 2077 — PORTAIL DE CAMPAGNE<br><a href="guide-joueur.html" target="_blank" style="color:rgba(0,255,136,.5);text-decoration:none;letter-spacing:2px;">❓ PREMIÈRE FOIS ICI ? LIS LE GUIDE DU JOUEUR</a></div>';
  return html;
}
function setAuthMode(m){authMode=m;render();}
function selSignupChar(k){
  selectedSignupRole=k;
  document.querySelectorAll('.authbox-charbtn').forEach(function(b){b.classList.remove('on');});
  var picked=document.querySelector('.authbox-charbtn[data-k="'+k+'"]');
  if(picked)picked.classList.add('on');
}
function submitAuth(){
  var u=document.getElementById('auth-username').value.trim();
  var p=document.getElementById('auth-password').value;
  var errEl=document.getElementById('auth-err'),msgEl=document.getElementById('auth-msg'),btn=document.getElementById('auth-submit-btn');
  errEl.textContent='';msgEl.textContent='';
  if(u.length<3){errEl.textContent='IDENTIFIANT TROP COURT (3 CARACTÈRES MIN)';return;}
  if(p.length<6){errEl.textContent='MOT DE PASSE TROP COURT (6 CARACTÈRES MIN)';return;}
  if(authMode==='signup'&&!selectedSignupRole){errEl.textContent='CHOISIS TON PERSONNAGE';return;}
  if(!window.firebase||!auth||!db){errEl.textContent='SERVICE INDISPONIBLE — RECHARGE LA PAGE';return;}
  btn.disabled=true;
  var fakeEmail=toFakeEmail(u);
  try{
    if(authMode==='signup'){
      var roleToSave=selectedSignupRole;
      auth.createUserWithEmailAndPassword(fakeEmail,p).then(function(cred){
        return db.collection('users').doc(cred.user.uid).set({
          username:u,role:roleToSave,sessionCode:null,approved:false,isMJ:false,
          createdAt:firebase.firestore.FieldValue.serverTimestamp()
        });
      }).catch(function(err){
        btn.disabled=false;
        if(err&&err.code==='auth/email-already-in-use'){errEl.textContent='CET IDENTIFIANT EXISTE DÉJÀ';}
        else if(err&&err.code==='auth/weak-password'){errEl.textContent='MOT DE PASSE TROP FAIBLE';}
        else{errEl.textContent='ERREUR : '+(err&&err.message?err.message:err);}
      });
    } else {
      auth.signInWithEmailAndPassword(fakeEmail,p).catch(function(err){
        btn.disabled=false;
        errEl.textContent='IDENTIFIANT OU MOT DE PASSE INCORRECT';
      });
    }
  }catch(syncErr){
    btn.disabled=false;
    errEl.textContent='ERREUR JS : '+(syncErr&&syncErr.message?syncErr.message:syncErr);
  }
}

function tool(ico,title,desc,color,url){
  return '<a class="card" href="'+url+'" target="_blank" style="--c:'+color+';"><span class="card-ico">'+ico+'</span><div class="card-title">'+title+'</div><div class="card-desc">'+desc+'</div></a>';
}

function doLogout(){
  var wrap=document.getElementById('wrap');wrap.innerHTML='<div class="loading">DÉCONNEXION...</div>';
  if(auth)auth.signOut();
  currentUser=null;currentUserData=null;
  setTimeout(render,300);
}

/* ═════ FIREBASE INIT (runs in background during boot animation) ═════ */
function identityBoot(){
  if(!window.firebase){setTimeout(identityBoot,150);return;}
  firebase.initializeApp(firebaseConfig);
  auth=firebase.auth();
  db=firebase.firestore();
  auth.onAuthStateChanged(function(user){
    if(user){
      currentUser=user;
      db.collection('users').doc(user.uid).get().then(function(snap){
        currentUserData=snap.exists?snap.data():null;
        render();
      }).catch(function(){currentUserData=null;render();});
    } else {
      currentUser=null;currentUserData=null;render();
    }
  });
}

/* ═════ BOOT SEQUENCE (cyberpunk data-transfer intro) ═════ */
var BOOT_LINES=[
  ['ÉTABLISSEMENT DU LIEN...','OK'],
  ['CONNEXION AU RÉSEAU NOIR...','OK'],
  ['SYNCHRONISATION SPECTRE...','OK'],
  ['DÉCHIFFREMENT DES ACCÈS...','en cours'],
  ['LOCALISATION NEO-PARIS...','trouvé'],
  ['CHARGEMENT DES DOSSIERS DE CAMPAGNE...',''],
  ['VÉRIFICATION IDENTITÉ...','']
];
function runBoot(){
  var skip=false;
  try{skip=sessionStorage.getItem('np2077_booted')==='1';}catch(e){}
  if(skip){finishBoot(true);return;}
  var linesEl=document.getElementById('boot-lines');
  var fillEl=document.getElementById('boot-fill');
  var pctEl=document.getElementById('boot-pct');
  var finalEl=document.getElementById('boot-final');
  var total=BOOT_LINES.length;
  var i=0;
  function nextLine(){
    if(i>=total){
      var pct=0;
      var pctInt=setInterval(function(){
        pct+=Math.ceil(Math.random()*14)+6;
        if(pct>=100){pct=100;clearInterval(pctInt);
          setTimeout(function(){finalEl.classList.add('on');setTimeout(function(){finishBoot(false);},650);},150);
        }
        fillEl.style.width=pct+'%';pctEl.textContent=pct+'%';
      },70);
      return;
    }
    var pair=BOOT_LINES[i];
    var row=document.createElement('div');
    row.className='boot-line'+(Math.random()<0.35?' glitch':'');
    row.innerHTML='<span class="lbl">&gt; '+pair[0]+'<span class="boot-cursor"></span></span><span class="val'+(pair[1]&&pair[1]!=='en cours'?' ok':'')+'">'+pair[1]+'</span>';
    linesEl.appendChild(row);
    requestAnimationFrame(function(){row.classList.add('on');});
    i++;
    setTimeout(nextLine,220+Math.random()*160);
  }
  nextLine();
  try{sessionStorage.setItem('np2077_booted','1');}catch(e){}
}
function finishBoot(instant){
  var boot=document.getElementById('boot');
  var wrap=document.getElementById('wrap');
  if(instant){boot.style.display='none';wrap.classList.add('show');return;}
  boot.classList.add('hide');
  wrap.classList.add('show');
  setTimeout(function(){boot.style.display='none';},550);
}

identityBoot();
runBoot();
</script>
