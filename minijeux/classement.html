<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CLASSEMENT // Mini-jeux</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js"></script>
<script src="scores.js"></script>
<style>
  *{box-sizing:border-box;}
  html,body{margin:0;background:#05050a;color:#e8e8f4;font-family:'Share Tech Mono',monospace;min-height:100%;}
  .wrap{max-width:560px;margin:0 auto;padding:56px 16px 40px;}
  h1{font-family:'Orbitron',monospace;font-size:22px;letter-spacing:4px;color:#ffc83c;text-align:center;margin:0 0 4px;}
  .sub{text-align:center;font-size:10px;letter-spacing:3px;color:rgba(255,255,255,.35);margin-bottom:22px;}
  .tabs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:18px;}
  .tabs button{padding:7px 12px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:transparent;color:rgba(255,255,255,.6);font-family:inherit;font-size:11px;letter-spacing:1px;cursor:pointer;}
  .tabs button.on{border-color:#ffc83c;color:#ffc83c;background:rgba(255,200,60,.08);}
  .card{background:#0b0b14;border:1px solid rgba(255,200,60,.25);border-radius:10px;padding:14px;}
  .hint{font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.35);margin-bottom:10px;}
  .np-row{display:flex;align-items:center;gap:10px;padding:9px 8px;border-bottom:1px solid rgba(255,255,255,.06);font-size:13px;}
  .np-row.me{background:rgba(255,200,60,.08);border-radius:4px;}
  .np-rk{width:26px;text-align:center;}
  .np-nm{flex:1;font-family:'Orbitron',monospace;font-size:12px;letter-spacing:1px;}
  .np-empty{padding:20px;text-align:center;font-size:12px;color:rgba(255,255,255,.4);}
  .meta{margin-top:14px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:10px;letter-spacing:1px;color:rgba(255,255,255,.35);}
  .play{display:inline-block;margin-top:12px;color:#00ccff;font-size:11px;letter-spacing:2px;text-decoration:none;}
  .reset{margin-top:18px;text-align:center;}
  .reset button{background:transparent;border:1px solid rgba(255,32,64,.4);color:#ff2040;font-family:inherit;font-size:10px;letter-spacing:2px;padding:8px 14px;border-radius:6px;cursor:pointer;}
  .back{position:fixed;top:12px;left:12px;font-size:10px;letter-spacing:2px;color:rgba(255,255,255,.4);text-decoration:none;border:1px solid rgba(255,255,255,.1);padding:6px 10px;border-radius:4px;background:#05050a;}
</style>
</head>
<body>
<a class="back" href="javascript:void(0)" onclick="if(window.history.length>1){history.back();}else{window.close();}">← RETOUR</a>
<div class="wrap">
  <h1>🏆 CLASSEMENT</h1>
  <div class="sub">MINI-JEUX D'ATTENTE</div>
  <div class="tabs" id="tabs"></div>
  <div class="card"><div class="hint" id="hint"></div><div id="board"></div><a class="play" id="play" target="_blank"></a></div>
  <div class="meta"><span id="who"></span><span id="conn"></span></div>
  <div class="reset" id="reset" style="display:none;"><button onclick="doReset()">EFFACER TOUS LES SCORES</button></div>
</div>
<script>
var cur='general';
function tabs(){
  var h='<button data-g="general" class="'+(cur==='general'?'on':'')+'">🏆 GÉNÉRAL</button>';
  Object.keys(NPScores.GAMES).forEach(function(g){
    h+='<button data-g="'+g+'" class="'+(cur===g?'on':'')+'">'+NPScores.GAMES[g].ico+' '+NPScores.esc(NPScores.GAMES[g].label)+'</button>';
  });
  var t=document.getElementById('tabs');t.innerHTML=h;
  t.querySelectorAll('button').forEach(function(b){b.onclick=function(){cur=b.getAttribute('data-g');draw();};});
}
function draw(){
  tabs();
  var id=NPScores.ident();
  var play=document.getElementById('play');
  if(cur==='general'){
    document.getElementById('hint').textContent='Points par jeu : 1er = 5, 2e = 3, 3e = 2, puis 1';
    document.getElementById('board').innerHTML=NPScores.overallHTML();
    play.style.display='none';
  } else {
    var g=NPScores.GAMES[cur];
    document.getElementById('hint').textContent=g.label+' — '+g.hint;
    document.getElementById('board').innerHTML=NPScores.boardHTML(cur);
    var q=id?'?code='+encodeURIComponent(id.code)+'&role='+id.role:'';
    play.href=g.url+q;play.textContent='JOUER À '+g.label.toUpperCase()+' →';play.style.display='inline-block';
  }
  document.getElementById('who').textContent=id?('SESSION : '+id.code+' · '+NPScores.CHARS[id.role].n):'';
  document.getElementById('conn').textContent=id?(NPScores.isOnline()?'EN LIGNE':'HORS LIGNE'):'';
  document.getElementById('reset').style.display=(id&&id.role==='mj')?'block':'none';
}
function doReset(){if(confirm('Effacer tous les scores de cette session ?'))NPScores.reset();}
NPScores.onUpdate(draw);
NPScores.init({noPanel:true});
setInterval(function(){var c=document.getElementById('conn');if(NPScores.ident())c.textContent=NPScores.isOnline()?'EN LIGNE':'HORS LIGNE';},2000);
draw();
</script>
</body>
</html>
